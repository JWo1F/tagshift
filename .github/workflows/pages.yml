name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          mkdir _site
          cp -R site/. _site/
          cp -R src _site/src
          # The import map points at the repository's ../src for local
          # previews; the deployed copy sits next to the page instead.
          sed -i 's|"\.\./src/index\.js"|"./src/index.js"|' _site/index.html
          grep -q '"./src/index.js"' _site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
