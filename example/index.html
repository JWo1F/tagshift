<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tagshift example</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --surface: #ffffff;
      --text: #1d1d1b;
      --muted: #6b6a66;
      --border: #e2e0da;
      --accent: #3b5bdb;
      --up: #2b8a3e;
      --down: #c92a2a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615;
        --surface: #1f1f1e;
        --text: #ecebe8;
        --muted: #9a9893;
        --border: #34332f;
        --accent: #8ca2ff;
        --up: #69db7c;
        --down: #ff8787;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px 64px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }

    main { max-width: 760px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p.lead { margin: 0 0 16px; color: var(--muted); }
    code { font-size: 14px; }

    .controls { margin-bottom: 12px; }

    button {
      font: inherit;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }

    .tile {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }

    .tile .label { color: var(--muted); font-size: 13px; }
    .tile .value { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
    .tile .value small { margin-left: 2px; color: var(--muted); font-size: 14px; font-weight: normal; }
    .tile .delta { font-size: 13px; font-variant-numeric: tabular-nums; }
    .tile--up .delta { color: var(--up); }
    .tile--down .delta { color: var(--down); }
    .tile .bar { height: 4px; margin-top: 8px; border-radius: 2px; background: var(--border); overflow: hidden; }
    .tile .fill { height: 100%; background: var(--accent); transition: width 0.4s ease; }
  </style>
</head>
<body>
  <template id="stat-tile">
    <div class="tile tile--${trend}">
      <span class="label">${label}</span>
      <strong class="value">${value}<small>${unit}</small></strong>
      <span class="delta">${delta}</span>
      <div class="bar"><div class="fill" style="width: ${percent}%"></div></div>
    </div>
  </template>

  <main>
    <h1>tagshift</h1>
    <p class="lead">Every second each tile gets new <code>props</code>, then <code>render()</code> updates its text, class and inline style in place.</p>

    <div class="controls">
      <button id="pause">Pause</button>
    </div>
    <div id="tiles" class="grid"></div>
  </main>

  <script type="module">
    import { define } from '../src/index.js';

    const StatTile = define(document.getElementById('stat-tile'));

    // A random walk per metric, written to the tiles every second.
    const metrics = [
      { label: 'CPU', unit: '%', value: 35, min: 0, max: 100, step: 12 },
      { label: 'Memory', unit: '%', value: 62, min: 0, max: 100, step: 4 },
      { label: 'Requests', unit: '/s', value: 480, min: 0, max: 1000, step: 90 },
      { label: 'Latency', unit: 'ms', value: 120, min: 20, max: 400, step: 35 },
    ];

    const tiles = document.getElementById('tiles');
    for (const metric of metrics) {
      metric.tile = new StatTile({ props: { label: metric.label, unit: metric.unit } });
      tiles.append(metric.tile.render());
    }

    function tick() {
      for (const metric of metrics) {
        const previous = metric.value;
        const next = previous + (Math.random() - 0.5) * 2 * metric.step;
        metric.value = Math.round(Math.min(metric.max, Math.max(metric.min, next)));

        const delta = metric.value - previous;
        Object.assign(metric.tile.props, {
          value: metric.value,
          delta: `${delta >= 0 ? '+' : '−'}${Math.abs(delta)}`,
          trend: delta >= 0 ? 'up' : 'down',
          percent: Math.round(((metric.value - metric.min) / (metric.max - metric.min)) * 100),
        });
        metric.tile.render();
      }
    }

    let timer = setInterval(tick, 1000);
    tick();

    document.getElementById('pause').addEventListener('click', (event) => {
      if (timer) {
        clearInterval(timer);
        timer = null;
      } else {
        timer = setInterval(tick, 1000);
      }
      event.target.textContent = timer ? 'Pause' : 'Resume';
    });
  </script>
</body>
</html>
